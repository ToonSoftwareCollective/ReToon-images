# eth0 and wlan0 sit in the same subnet. Without a cable, eth0's routes
# must not be used, or replies to the WiFi address go out the dead port.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
# answer ARP only for the address of the port the request came in on
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
